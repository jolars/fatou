[package]
name = "fatou-formatter"
version = "0.1.0"
edition.workspace = true
readme = "README.md"
description = "Deterministic, rule-based formatter for the Julia language"
license.workspace = true
repository.workspace = true
homepage = "https://fatou.dev"
documentation = "https://docs.rs/fatou-formatter"
authors.workspace = true
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
keywords = ["julia", "formatter"]
categories = ["development-tools", "text-processing"]

[dependencies]
fatou-parser = { path = "../fatou-parser", version = "0.1.0" }
rowan = "0.16.1"
