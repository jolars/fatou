[package]
name = "fatou-parser"
version = "0.1.0"
edition.workspace = true
readme = "README.md"
description = "Lossless CST parser, typed AST wrappers, and incremental reparser for the Julia language"
license.workspace = true
repository.workspace = true
homepage = "https://fatou.dev"
documentation = "https://docs.rs/fatou-parser"
authors.workspace = true
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
keywords = ["julia", "parser", "cst", "incremental"]
categories = ["parsing", "parser-implementations", "text-processing"]

[dependencies]
rowan = "0.17.0"
serde = { version = "1.0.228", features = ["derive"] }
unicode-normalization = "0.1.24"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
insta = "1.47.2"
serde_json = "1.0.145"

[[bench]]
name = "reparse"
harness = false
