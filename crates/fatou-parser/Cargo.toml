[package]
name = "fatou-parser"
version = "0.3.0"
edition.workspace = true
readme = "README.md"
description = "Lossless CST parser, typed AST wrappers, and incremental reparser for the Julia language"
license.workspace = true
repository.workspace = true
homepage = "https://fatou.dev"
documentation = "https://docs.rs/fatou-parser"
authors.workspace = true
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
keywords = ["julia", "parser", "cst", "incremental"]
categories = ["parsing", "parser-implementations", "text-processing"]

[features]
# The reparse benchmark only, never enabled by a consumer. Criterion is the
# workspace's one C-toolchain dependency (`alloca` runs a `cc` build script),
# and cargo builds a package's dev-dependencies whenever any of its targets
# needs them — `required-features` on the bench alone does not keep it out of
# `--all-targets`. An *optional* dependency does, which is the only reason
# criterion sits under `[dependencies]` rather than `[dev-dependencies]`.
bench = ["dep:criterion"]

[dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
], optional = true }
rowan = "0.17.0"
serde = { version = "1.0.228", features = ["derive"] }
unicode-normalization = "0.1.24"

[dev-dependencies]
insta = "1.47.2"
serde_json = "1.0.145"

[[bench]]
name = "reparse"
harness = false
required-features = ["bench"]
