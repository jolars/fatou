version: "3"

tasks:
  lint:
    desc: Run clippy with warnings as errors
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    desc: Format the code with rustfmt
    cmds:
      - cargo fmt --all --

  format-check:
    desc: Check rustfmt formatting
    cmds:
      - cargo fmt --all -- --check

  build-release:
    desc: Build the release binary
    cmds:
      - cargo build --release

  test:
    desc: Run the test suite
    cmds:
      - cargo test --workspace

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test --workspace

  audit:
    desc: Run a security audit of dependencies
    cmds:
      - cargo audit

  deny:
    desc: Check licenses, advisories, and sources
    cmds:
      - cargo deny check

  bench:
    desc: Benchmark formatter throughput vs Runic and JuliaFormatter (writes bench/results.json and the docs table)
    cmds:
      - ./bench/compare_format.sh

  bench-memory:
    desc: Measure language-server and CLI memory vs LanguageServer.jl and JETLS (writes bench/memory.json)
    cmds:
      - ./bench/memory_compare.sh

  bench-reparse:
    desc: Benchmark incremental reparse against a full parse (needs bench-corpus)
    cmds:
      - cargo bench -p fatou-parser --features bench --bench reparse

  bench-corpus:
    desc: Fetch the pinned JuliaSyntax.jl corpus for the formatter benchmark
    cmds:
      - ./bench/corpus/download.sh

  bench-lsenv:
    desc: Provision the pinned LanguageServer.jl and JETLS environments the memory benchmark needs
    cmds:
      - ./bench/lsenv/setup.sh

  docs-preview:
    desc: Serve the docs site locally with live reload
    cmds:
      - mdbook serve docs --open

  docs-build:
    desc: Build the docs site into docs/book with canonical links and sitemap
    cmds:
      - mdbook build docs
      - task: docs-canonical
      - task: docs-sitemap

  docs-canonical:
    desc: Inject <link rel="canonical"> into each rendered page
    cmds:
      - >-
        cargo run --quiet --example canonical --
        docs/book https://fatou.dev/

  docs-sitemap:
    desc: Generate docs/book/sitemap.xml from the rendered book
    cmds:
      - >-
        cargo run --quiet --example sitemap --
        docs/book https://fatou.dev/

  aur:push:
    desc: "Manually publish fatou-bin to the AUR (CI fallback; args: [version] [pkgrel])"
    cmds:
      - ./scripts/aur_push.sh {{.CLI_ARGS}}

  logo:
    desc: 'Generate the logo (pass params after --, e.g. `task logo -- mode=newton`)'
    cmds:
      - julia -t auto scripts/generate-logo.jl {{.CLI_ARGS}}

  logo-watch:
    desc: 'Re-generate the logo whenever the script changes (`task logo-watch -- mode=newton`)'
    watch: true
    sources:
      - scripts/generate-logo.jl
    cmds:
      - julia -t auto scripts/generate-logo.jl {{.CLI_ARGS}}

  icons:
    desc: Derive the site icons (favicon, apple-touch-icon) from assets/logo.png
    sources:
      - assets/logo.png
      - scripts/generate-icons.sh
    generates:
      - docs/theme/favicon.png
      - docs/theme/favicon.svg
      - docs/src/apple-touch-icon.png
    cmds:
      - ./scripts/generate-icons.sh
