version: "3"

tasks:
  lint:
    desc: Run clippy with warnings as errors
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    desc: Format the code with rustfmt
    cmds:
      - cargo fmt --all --

  format-check:
    desc: Check rustfmt formatting
    cmds:
      - cargo fmt --all -- --check

  build-release:
    desc: Build the release binary
    cmds:
      - cargo build --release

  test:
    desc: Run the test suite
    cmds:
      - cargo test --workspace

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test --workspace

  audit:
    desc: Run a security audit of dependencies
    cmds:
      - cargo audit

  deny:
    desc: Check licenses, advisories, and sources
    cmds:
      - cargo deny check

  bench:
    desc: Benchmark formatter throughput vs Runic and JuliaFormatter (writes bench/results.json and the docs table)
    cmds:
      - ./bench/compare_format.sh

  bench-lsp:
    desc: Measure language-server speed and memory vs LanguageServer.jl and JETLS (writes bench/memory.json)
    cmds:
      - ./bench/memory_compare.sh

  bench-memory:
    desc: Alias for bench-lsp
    cmds:
      - task: bench-lsp

  profile:
    desc: Profile the formatter with perf, writing bench/profile.svg (needs bench-corpus)
    cmds:
      - ./bench/profile.sh {{.CLI_ARGS}}

  bench-reparse:
    desc: Benchmark incremental reparse against a full parse (needs bench-corpus)
    cmds:
      - cargo bench -p fatou-parser --features bench --bench reparse

  bench-lex:
    desc: Benchmark lexer throughput, including the operator table (needs bench-corpus)
    cmds:
      - cargo bench -p fatou-parser --features bench --bench lex

  bench-corpus:
    desc: Fetch the pinned JuliaSyntax.jl corpus for the formatter benchmark
    cmds:
      - ./bench/corpus/download.sh

  bench-lsenv:
    desc: Provision the pinned LanguageServer.jl and JETLS environments the LSP benchmark needs
    cmds:
      - ./bench/lsenv/setup.sh

  docs-preview:
    desc: Serve VitePress locally with live reload
    cmds:
      - pnpm --dir docs dev

  docs-build:
    desc: Build and validate the documentation site
    cmds:
      - pnpm --dir docs build

  docs-worker:
    desc: Preview the built site through Cloudflare Workers locally
    cmds:
      - pnpm --dir docs preview:worker

  docs-check:
    desc: Check Worker behavior against a running local preview
    cmds:
      - pnpm --dir docs test
      - pnpm --dir docs test:wasm
      - pnpm --dir docs check:worker {{.CLI_ARGS}}
      - pnpm --dir docs deploy:check

  aur:push:
    desc: "Manually publish fatou-bin to the AUR (CI fallback; args: [version] [pkgrel])"
    cmds:
      - ./scripts/aur_push.sh {{.CLI_ARGS}}

  logo:
    desc: 'Generate the logo (pass params after --, e.g. `task logo -- mode=newton`)'
    cmds:
      - julia -t auto scripts/generate-logo.jl {{.CLI_ARGS}}

  logo-watch:
    desc: 'Re-generate the logo whenever the script changes (`task logo-watch -- mode=newton`)'
    watch: true
    sources:
      - scripts/generate-logo.jl
    cmds:
      - julia -t auto scripts/generate-logo.jl {{.CLI_ARGS}}

  logo-hero:
    desc: Generate the borderless landing page fractal
    cmds:
      - julia -t auto scripts/generate-logo.jl mode=newton width=1200 height=630 extent=3 whiten=20 border=0 out=docs/src/public/images/logo-hero
      - magick docs/src/public/images/logo-hero.png -strip -define png:compression-level=9 docs/src/public/images/logo-hero.png

  icons:
    desc: Derive the site icons (favicon, apple-touch-icon) from assets/logo.png
    sources:
      - assets/logo.png
      - scripts/generate-icons.sh
    generates:
      - docs/src/public/theme/favicon.png
      - docs/src/public/theme/favicon.svg
      - docs/src/public/apple-touch-icon.png
    cmds:
      - ./scripts/generate-icons.sh
