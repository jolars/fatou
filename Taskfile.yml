version: "3"

tasks:
  lint:
    desc: Run clippy with warnings as errors
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    desc: Format the code with rustfmt
    cmds:
      - cargo fmt --all --

  format-check:
    desc: Check rustfmt formatting
    cmds:
      - cargo fmt --all -- --check

  build-release:
    desc: Build the release binary
    cmds:
      - cargo build --release

  test:
    desc: Run the test suite
    cmds:
      - cargo test --workspace

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test --workspace

  audit:
    desc: Run a security audit of dependencies
    cmds:
      - cargo audit

  deny:
    desc: Check licenses, advisories, and sources
    cmds:
      - cargo deny check

  bench:
    desc: Run all benchmarks published in the documentation
    cmds:
      - task: bench-format
      - task: bench-lsp

  bench-format:
    desc: Benchmark Fatou, Runic, and JuliaFormatter (writes bench/results.json)
    cmds:
      - ./bench/compare_format.sh

  bench-lsp:
    desc: Measure language-server speed and memory vs LanguageServer.jl and JETLS (writes bench/memory.json)
    cmds:
      - ./bench/memory_compare.sh

  bench-lsp-ab:
    desc: Compare two Fatou release binaries over the same editing workload
    cmds:
      - python3 bench/lsp_ab.py {{.CLI_ARGS}}

  profile:
    desc: Profile the formatter with perf, writing bench/profile.svg (needs bench-corpus)
    cmds:
      - ./bench/profile.sh {{.CLI_ARGS}}

  bench-reparse:
    desc: Benchmark incremental reparse against a full parse (needs bench-corpus)
    cmds:
      - cargo bench -p fatou-parser --features bench --bench reparse

  bench-lex:
    desc: Benchmark lexer throughput, including the operator table (needs bench-corpus)
    cmds:
      - cargo bench -p fatou-parser --features bench --bench lex

  bench-corpus:
    desc: Fetch the pinned JuliaSyntax.jl corpus for the formatter benchmark
    cmds:
      - ./bench/corpus/download.sh

  docs-preview:
    desc: Serve VitePress locally with live reload
    cmds:
      - pnpm --dir docs dev

  docs-build:
    desc: Build and validate the documentation site
    cmds:
      - pnpm --dir docs build

  docs-worker:
    desc: Preview the built site through Cloudflare Workers locally
    cmds:
      - pnpm --dir docs preview:worker

  docs-check:
    desc: Check Worker behavior against a running local preview
    cmds:
      - pnpm --dir docs test
      - pnpm --dir docs test:wasm
      - pnpm --dir docs check:worker {{.CLI_ARGS}}
      - pnpm --dir docs deploy:check

  aur:push:
    desc: "Manually publish fatou-bin to the AUR (CI fallback; args: [version] [pkgrel])"
    cmds:
      - ./scripts/aur_push.sh {{.CLI_ARGS}}

  logo:
    desc: Generate the basin triad logo and published brand assets (excluding favicons)
    cmds:
      - julia -t auto scripts/generate-brand.jl

  logo-watch:
    desc: Regenerate the basin triad logo when its source changes
    watch: true
    sources:
      - scripts/generate-logo.jl
      - scripts/generate-brand.jl
    cmds:
      - julia -t auto scripts/generate-brand.jl

  logo-hero:
    desc: Regenerate the logo assets, including the landing page hero
    cmds:
      - task: logo

  og-image:
    desc: Render the manually edited social card SVG to PNG
    cmds:
      - magick -background none docs/src/public/images/og-image.svg -strip -define png:compression-level=9 docs/src/public/images/og-image.png

  icons:
    desc: Install the RealFaviconGenerator bundle (optionally pass a new bundle URL)
    cmds:
      - ./scripts/generate-icons.sh {{.CLI_ARGS}}
