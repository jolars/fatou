[workspace]
members = ["crates/fatou-parser", "crates/fatou-formatter"]
# The mdBook preprocessor builds and runs from its own directory, so it must not
# be pulled into this workspace.
exclude = ["docs/doc-utils"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jolars/fatou"
authors = ["Johan Larsson <johan@jolars.co>"]

[package]
name = "fatou"
version = "0.14.0"
edition.workspace = true
readme = "README.md"
description = "A language server, formatter, and linter for Julia"
homepage = "https://fatou.dev"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["julia", "language-server", "formatter", "linter"]
categories = [
    "command-line-utilities",
    "text-processing",
    "parsing",
    "parser-implementations",
]
include = [
    "/src/**/*.rs",
    "/src/**/*.txt",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "fatou"

[[bin]]
name = "fatou"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.12.16"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
env_logger = "0.11.10"
fatou-formatter = { path = "crates/fatou-formatter", version = "0.3.2" }
fatou-parser = { path = "crates/fatou-parser", version = "0.4.0" }
globset = "0.4.18"
ignore = "0.4.26"
log = { version = "0.4.32", features = ["release_max_level_info"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
ropey = { version = "2.0.0-beta.1", features = ["metric_utf16", "metric_lines_lf"] }
rowan = "0.17.0"
salsa = "0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = { version = "3.1.1", features = ["text"] }
smol_str = "0.3.6"
toml = "1.1.2"

[dev-dependencies]
insta = "1.47.2"
tempfile = "3.27.0"

[[bench]]
name = "format_compare"
harness = false

[[bench]]
name = "line_index"
harness = false

[[bench]]
name = "format_edits"
harness = false

[profile.release]
strip = "symbols"

# Release codegen with symbols kept, so a profiler can attribute samples.
# `strip = "symbols"` above is what ships; it would otherwise be inherited here
# and leave every frame in a flamegraph unresolved.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clapdown = "0.2.0"
clap_complete = "4.6.5"
clap_mangen = "0.3.0"

[package.metadata.deb]
maintainer = "Johan Larsson <johan@jolars.co>"
copyright = "2026, Johan Larsson <johan@jolars.co>"
license-file = ["LICENSE", "4"]
extended-description = """\
Fatou is a formatter, linter, and language server for Julia. It formats \
.jl files with deterministic, rule-based layout, reports diagnostics with \
optional autofixes, and exposes an integrated language server for editor \
support."""
depends = "$auto"
section = "text"
priority = "optional"
assets = [
    [
        "target/release/fatou",
        "usr/bin/",
        "755",
    ],
    [
        "README.md",
        "usr/share/doc/fatou/",
        "644",
    ],
    [
        "LICENSE",
        "usr/share/doc/fatou/",
        "644",
    ],
    [
        "target/man/*.1",
        "usr/share/man/man1/",
        "644",
    ],
    [
        "target/completions/fatou.bash",
        "usr/share/bash-completion/completions/fatou",
        "644",
    ],
    [
        "target/completions/fatou.fish",
        "usr/share/fish/vendor_completions.d/fatou.fish",
        "644",
    ],
    [
        "target/completions/_fatou",
        "usr/share/zsh/vendor-completions/_fatou",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fatou", dest = "/usr/bin/fatou", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/fatou/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/fatou/LICENSE", mode = "644", doc = true },
    { source = "target/man/*.1", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "target/completions/fatou.bash", dest = "/usr/share/bash-completion/completions/fatou", mode = "644" },
    { source = "target/completions/fatou.fish", dest = "/usr/share/fish/vendor_completions.d/fatou.fish", mode = "644" },
    { source = "target/completions/_fatou", dest = "/usr/share/zsh/vendor-completions/_fatou", mode = "644" },
]
