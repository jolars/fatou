[advisories]
version = 2
yanked = "deny"
ignore = [
  # atomic-polyfill is unmaintained but reached only transitively through
  # postcard -> heapless, with no safe upgrade available.
  "RUSTSEC-2023-0089",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

# option-ext is MPL-2.0 (weak, file-level copyleft) and reached only
# transitively through dirs -> dirs-sys.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
