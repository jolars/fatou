name: Publish Crates

on:
  workflow_dispatch:
  push:
    tags:
      # The member tags are included so a library-only release publishes
      # immediately; `--skip-published` makes overlapping runs idempotent.
      - "v*"
      - "fatou-parser-v*"
      - "fatou-formatter-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v7

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      # Publishes in dependency order (fatou-parser, fatou-formatter, fatou);
      # `--from-git` takes the versions at this commit and `--skip-published`
      # silently skips crates already on crates.io.
      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo workspaces publish --from-git --skip-published --no-verify --yes
