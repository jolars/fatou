name: Documentation
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "crates/fatou-parser/**"
      - "crates/fatou-formatter/**"
      - "crates/fatou-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "bench/*.json"
      - "scripts/fatou-installer.*"
      - "fatou.schema.json"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "build.rs"
      - "src/cli.rs"
      - "src/linter/**"
      - "examples/docgen.rs"
      - ".github/workflows/docs.yml"
permissions:
  contents: read
jobs:
  build:
    name: Build and Check Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            docs/doc-utils -> target
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:wasm
      - name: Verify installer syntax
        run: sh -n .vitepress/dist/install
      - name: Check deployment bundle
        run: pnpm deploy:check
      - name: Check local Worker
        shell: bash
        run: |
          pnpm preview:worker > worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"; cat worker.log' EXIT
          for ((attempt = 0; attempt < 30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              pnpm check:worker
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/.vitepress/dist
          include-hidden-files: true
  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs/.vitepress/dist
      - run: pnpm deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live site
        run: pnpm check:worker https://fatou.dev
