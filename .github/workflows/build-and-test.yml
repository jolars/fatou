name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # `fatou-parser` and `fatou-formatter` are meant to be embeddable in a
      # dprint Wasm plugin, which builds only for wasm32-unknown-unknown.
      # Nothing else in the workspace targets wasm, so this job is the only
      # thing keeping the member crates free of filesystem/thread/time
      # dependencies.
      - name: Build fatou-parser for wasm
        run: >
          cargo build -p fatou-parser --release
          --target wasm32-unknown-unknown
      - name: Build fatou-formatter for wasm
        run: >
          cargo build -p fatou-formatter --release
          --target wasm32-unknown-unknown --features schema

  supply-chain:
    name: audit & deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, wasm, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.versionary.outputs.release_created }}
      tag_name: ${{ steps.versionary.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - id: versionary
        uses: jolars/versionary@v0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  build-release-assets:
    name: Build & Upload Release Assets
    needs: versionary
    # `startsWith(…, 'v')` keeps member-crate releases (`fatou-parser-v*`,
    # `fatou-formatter-v*`) from triggering CLI asset builds.
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/packages.yml
    with:
      upload: "true"
      tag: ${{ needs.versionary.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write # mint the OIDC token for keyless provenance signing
      attestations: write # store the build provenance attestation

  publish-extensions:
    name: Publish Editor Extensions
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-code-extensions.yml
    with:
      release-tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit

  publish-aur:
    name: Publish AUR Package
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
