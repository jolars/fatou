name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check
        run: cargo +1.89.0 check --workspace --all-targets --all-features --locked

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      # `fatou-parser` and `fatou-formatter` are meant to be embeddable in a
      # dprint Wasm plugin, which builds only for wasm32-unknown-unknown.
      # Nothing else in the workspace targets wasm, so this job is the only
      # thing keeping the member crates free of filesystem/thread/time
      # dependencies.
      - name: Build fatou-parser for wasm
        run: >
          cargo build -p fatou-parser --release
          --target wasm32-unknown-unknown
      - name: Build fatou-formatter for wasm
        run: >
          cargo build -p fatou-formatter --release
          --target wasm32-unknown-unknown --features schema

  zed:
    name: zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip2
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
          key: zed
      # `editors/zed` is its own workspace (a `wasm32-wasip2` cdylib on edition
      # 2021), so none of the workspace-wide jobs above reach it. Without this
      # job the extension would only ever be compiled by Zed's registry, long
      # after the change that broke it landed.
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: editors/zed
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: editors/zed
      - name: Test
        run: cargo test --locked
        working-directory: editors/zed
      # `--locked` is also what catches a `Cargo.lock` left behind by a version
      # bump, since nothing else regenerates it.
      - name: Build for wasm
        run: cargo build --release --target wasm32-wasip2 --locked
        working-directory: editors/zed

  minimal-versions:
    name: minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Nightly resolves the lockfile; the compile itself still runs on the
      # same stable toolchain as every other job, so nightly rustc churn can
      # never fail this gate.
      - name: Install Rust
        run: |
          rustup toolchain install nightly
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-versions
      # The manifests' lower bounds are a promise to downstream crates:
      # `fatou-parser` and `fatou-formatter` are published, so whatever version
      # a dependent's resolver picks has to actually compile. The committed
      # lockfile hides an understated bound because it always picks the latest
      # patch; resolving every *direct* dependency down to its declared minimum
      # is what tests the promise. (Plain `-Z minimal-versions` would drag
      # transitive deps down too, which turns third-party sloppiness into our
      # CI failures.)
      - name: Resolve direct dependencies to their declared minimums
        run: cargo +nightly generate-lockfile -Z direct-minimal-versions
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

  supply-chain:
    name: audit & deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, msrv, wasm, zed, minimal-versions, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.versionary.outputs.release_created }}
      tag_name: ${{ steps.versionary.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust
        run: rustup toolchain install

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  build-release-assets:
    name: Build & Upload Release Assets
    needs: versionary
    # `startsWith(…, 'v')` keeps member-crate releases (`fatou-parser-v*`,
    # `fatou-formatter-v*`) from triggering CLI asset builds.
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/packages.yml
    with:
      upload: "true"
      tag: ${{ needs.versionary.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write # mint the OIDC token for keyless provenance signing
      attestations: write # store the build provenance attestation

  publish-extensions:
    name: Publish Editor Extensions
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-code-extensions.yml
    with:
      release-tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit

  publish-aur:
    name: Publish AUR Package
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
