name: Bug report
description: A crash, a losslessness or idempotence violation, wrong output, or LSP misbehavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Losslessness (reconstruct == input) and idempotence (formatting twice ==
        formatting once) are core invariants; violations of either are always
        bugs. Fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: e.g. panic, `reconstruct != input`, non-idempotent format, wrong diagnostic, LSP misbehavior.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input `.jl`
      render: julia
  - type: textarea
    id: settings
    attributes:
      label: "`fatou.toml` settings (if any)"
      render: toml
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: julia
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: julia
  - type: input
    id: version
    attributes:
      label: Command and version
      description: e.g. `fatou format file.jl`; `fatou --version`; OS.
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
