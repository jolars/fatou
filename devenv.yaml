inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Fallback for platforms without an archive in julia-oracle.lock.json.
  nixpkgs-julia:
    url: github:NixOS/nixpkgs/759db4b3e05ea6290cb614f1766d119183d68134
    flake: false
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
